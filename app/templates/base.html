{%- set path = request.url.path -%}
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Warehouse Guess{% endblock %} · Warehouse Guess</title>
  <link rel="icon" href="/static/icon.png">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body>
<div class="layout">
  <aside class="side">
    <a class="brand" href="/"><img src="/static/icon.png" alt="" width="30" height="30"><span>Warehouse Guess</span></a>
    <nav>
      <a href="/" class="{{ 'on' if path == '/' }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard</a>
      <a href="/search" class="{{ 'on' if path.startswith('/search') or path.startswith('/results') }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        Ricerca</a>
      <a href="/catalog" class="{{ 'on' if path.startswith('/catalog') }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
        Catalogo codici</a>
      <a href="/sites" class="{{ 'on' if path.startswith('/sites') }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 4.5 4h15L21 9.5"/><path d="M3 9.5h18v1a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0Z"/><path d="M5 13v7h14v-7"/></svg>
        Siti</a>
    </nav>
    <div class="foot">App locale · i dati restano sul tuo PC</div>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="/static/app.js?v={{ asset_version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
