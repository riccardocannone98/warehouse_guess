<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Warehouse Guess{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Warehouse Guess</a>
    <nav>
      <a href="/" class="{{ 'on' if request.url.path == '/' or request.url.path.startswith('/results') }}">Ricerca</a>
      <a href="/sites" class="{{ 'on' if request.url.path.startswith('/sites') }}">Siti</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
